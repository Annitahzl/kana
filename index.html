<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Тренажёр каны</title>
<style>
:root{--bg:#f7f3f8;--card:#fffcff;--ink:#2a2230;--muted:#7a6f80;--line:#e6dde9;--accent:#640062;--accent-ink:#fff;--accent-soft:#f1dcef;--ok:#4f7d0c;--ok-soft:#e3f0d0;--bad:#c8361d;--bad-soft:#fbe0da}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17121a;--card:#211a25;--ink:#f1ebf2;--muted:#a597aa;--line:#382d3d;--accent:#d39bd1;--accent-ink:#2a0f29;--accent-soft:#45173f;--ok:#a0c950;--ok-soft:#28351a;--bad:#ff7a63;--bad-soft:#40201d;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17121a;--card:#211a25;--ink:#f1ebf2;--muted:#a597aa;--line:#382d3d;--accent:#d39bd1;--accent-ink:#2a0f29;--accent-soft:#45173f;--ok:#a0c950;--ok-soft:#28351a;--bad:#ff7a63;--bad-soft:#40201d;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.jp{font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","Yu Mincho","YuMincho","Hiragino Mincho ProN","Noto Serif JP","MS Mincho",serif;font-weight:400}
.wrap{max-width:640px;margin:0 auto;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1{font-size:20px;margin:4px 0 12px}
nav{display:flex;gap:6px;flex-wrap:wrap}
nav button{flex:1 1 auto;padding:8px 10px;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;cursor:pointer;font:inherit;font-size:14px}
nav button.on{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
details{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 12px}
summary{cursor:pointer;color:var(--muted);font-size:14px}
.set{display:flex;flex-wrap:wrap;gap:8px 14px;margin:10px 0 4px;font-size:15px}
.set label{display:flex;align-items:center;gap:4px;cursor:pointer}
.set b{font-weight:600;width:100%;font-size:13px;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-top:12px;min-height:380px}
.prompt{text-align:center;min-height:170px;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px 0}
.big{font-size:128px;line-height:1.1}
.listen{width:112px;height:112px;border-radius:50%;border:1px solid var(--accent);background:var(--accent-soft);color:var(--ink);font-size:46px;cursor:pointer;margin-bottom:8px}
.listen:active{transform:scale(.95)}
.opt.w{font-size:30px}
.warn{margin-top:10px;padding:8px 12px;border-radius:10px;background:var(--bad-soft);color:var(--ink);font-size:14px;text-align:left}
.word{font-size:64px;line-height:1.2}
.ru{font-size:34px;font-weight:600}
.ro{color:var(--muted)}
.mean{font-size:18px;margin-top:4px}
.hint{text-align:center;color:var(--muted);min-height:90px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.opt{position:relative;padding:14px 8px;font-size:24px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;cursor:pointer;font-family:inherit}
.opt.jp{font-size:44px;line-height:1.2}
.opt small{display:block;font-size:13px;color:var(--muted);font-family:system-ui,sans-serif}
.opt .k{position:absolute;top:6px;left:9px;font-size:11px;color:var(--muted);font-family:system-ui,sans-serif}
.opt:disabled{cursor:default}
.right{background:var(--ok-soft)!important;border-color:var(--ok)!important}
.wrong{background:var(--bad-soft)!important;border-color:var(--bad)!important}
.fb{margin-top:12px;text-align:center;min-height:44px}
.fb .jp{font-size:28px}
.act{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.btn{padding:12px 18px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;cursor:pointer;min-width:140px}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.good{background:var(--ok-soft);border-color:var(--ok)}
.btn.bad{background:var(--bad-soft);border-color:var(--bad)}
.btn.small{padding:6px 14px;min-width:0;font-size:14px;flex:0 0 auto!important}
.status{align-items:center}
.btn .k{font-size:11px;opacity:.7;margin-left:6px}
.status{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:12px;font-size:14px;color:var(--muted)}
.chip{display:inline-block;padding:0 6px;margin:0 2px;border-radius:6px;background:var(--bad-soft);color:var(--ink);font-size:20px}
h3{margin:8px 0;font-size:15px;color:var(--muted);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:14px}
.cell{border:1px solid var(--line);border-radius:10px;text-align:center;padding:6px 2px;background:var(--bg)}
.cell .jp{font-size:34px;display:block;line-height:1.2}
.cell small{color:var(--muted)}
.m-ok{background:var(--ok-soft);border-color:var(--ok)}
.m-mid{background:var(--accent-soft)}
.m-bad{background:var(--bad-soft);border-color:var(--bad)}
.legend{font-size:13px;color:var(--muted)}
.legend span{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin:0 4px 0 10px;border:1px solid var(--line)}
.hardbox{display:flex;align-items:center;gap:8px;margin-top:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card);cursor:pointer;font-size:15px}
.hardbox:has(input:checked){background:var(--bad-soft);border-color:var(--bad)}
.hardbox[hidden]{display:none}
.hardbox input{width:18px;height:18px;accent-color:var(--bad)}
.hardbox .count{margin-left:auto;color:var(--muted);font-size:14px}
.opt.m{font-size:18px;min-height:64px}
.prompt .ru.kmean{font-size:30px}
.ex{margin-top:10px;color:var(--ink);font-size:16px}
.ex .jp{font-size:24px}
.cell.k small{font-size:11px;line-height:1.2;display:block}
.progress{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--accent)}
.tmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:14px;margin:0 0 8px}
.tq{font-size:32px;line-height:1.6;text-align:center;margin:18px 0 4px}
.blank{display:inline-block;min-width:2.5em;border-bottom:3px solid var(--accent);color:var(--accent);margin:0 .15em}
.fill{color:var(--ok);border-bottom:3px solid var(--ok);margin:0 .15em}
.tr{text-align:center;color:var(--muted);margin-bottom:16px;font-size:17px}
.opt.t{font-size:26px;line-height:1.3}
.rd{font-size:18px;margin:6px 0}
.say{color:var(--muted);font-size:14px}
.score{font-size:56px;font-weight:700;text-align:center;margin:10px 0 0}
.res{list-style:none;padding:0;margin:16px 0;display:grid;gap:10px}
.res li{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--bg)}
.res .jp{font-size:22px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px 12px;flex-wrap:wrap;margin:4px 0 12px}
.top h1{margin:0}
.jpt{color:var(--ok);font-size:22px;margin-left:10px;letter-spacing:.05em;white-space:nowrap}
.timer{position:relative;overflow:hidden;padding:6px 14px 8px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-variant-numeric:tabular-nums;font-size:16px;font-weight:600;white-space:nowrap}
.timer i{position:absolute;left:0;bottom:0;height:3px;width:0;background:var(--accent);transition:width .5s}
.tgoal{color:var(--muted);font-weight:400;margin-left:4px}
.tstate{color:var(--muted);font-weight:400;font-size:13px;margin-left:6px}
.timer.paused #tmText{color:var(--muted)}
.timer.done{background:var(--ok-soft);border-color:var(--ok)}
.timer.done i{background:var(--ok)}
.tbox{display:flex;align-items:center;gap:6px}
.check{width:24px;height:24px;border-radius:50%;background:var(--ok);color:var(--card);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex:none}
.check[hidden]{display:none}
.check.pop{animation:pop .7s ease-out}
@keyframes pop{0%{transform:scale(.2)}60%{transform:scale(1.3)}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){.check.pop{animation:none}}
.grid.g{margin-bottom:6px}
.rowtools{width:100%;font-size:13px;color:var(--muted)}
.link{background:none;border:none;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;padding:0}
@media (max-width:420px){.big{font-size:104px}.word{font-size:48px}.btn{min-width:0;flex:1}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <h1>Тренажёр каны и иероглифов<span class="jpt jp" lang="ja">かな・漢字</span></h1>
    <div class="tbox">
      <span class="check" id="tmCheck" hidden title="Сегодня 10 минут есть">✓</span>
      <div class="timer" id="timer" title="Время занятий сегодня. Останавливается, если страница свёрнута или вы ничего не нажимаете 1,5 минуты.">
        <span id="tmText">00:00</span><span class="tgoal" id="tmGoal">/ 10:00</span><span class="tstate" id="tmState"></span><i id="tmBar"></i>
      </div>
    </div>
  </div>
  <nav id="nav">
    <button data-mode="choice" id="navChoice">Знак → звук</button>
    <button data-mode="rev" id="navRev">Звук → знак</button>
    <button data-mode="card">Карточки</button>
    <button data-mode="listen">На слух</button>
    <button data-mode="word">Слова</button>
    <button data-mode="table">Таблица</button>
  </nav>
  <details>
    <summary id="summary">Настройки: что тренировать</summary>
    <div class="set" id="script"><b>Что тренируем</b>
      <label><input type="radio" name="sc" value="hira"> хирагана</label>
      <label><input type="radio" name="sc" value="kata"> катакана</label>
      <label><input type="radio" name="sc" value="both"> обе азбуки</label>
      <label><input type="radio" name="sc" value="kanji"> иероглифы</label>
    </div>
    <div class="set" id="groups"></div>
    <div class="set"><b>Проверка</b><button class="btn primary small" id="startTest">Тест: 10 предложений</button></div>
  </details>
  <div class="card" id="stage"></div>
  <div class="status"><span id="sess"></span><button class="btn bad small" id="trainHard" hidden>Тренировать ошибки</button><button class="link" id="reset">Сбросить статистику</button></div>
  <div class="status" id="hard"></div>
</div>

 stage.querySelectorAll('.opt').forEach((b,j)=>{if(q.opts[j]===q.a)b.classList.add('right');else if(j===i)b.classList.add('wrong');b.disabled=true});
 const last=TS.i===TS.qs.length-1;
 $('fb').innerHTML=`<div>${ok?'Верно!':'Не совсем.'}</div>
  <div class="jp tq" style="font-size:24px;margin:6px 0 0">${fillS(q,`<span class="fill">${q.a}</span>`)}</div>
  <div class="rd">${q.rd}</div>
  <div class="say">Прочитайте предложение вслух 2–3 раза</div><br>
  <button class="btn primary" id="tnx">${last?'Результат':'Дальше'}<span class="k">Enter</span></button>`;
 $('tnx').onclick=testNext}
function testNext(){if(!TS)return;TS.i++;renderTest()}
function renderResults(){
 const n=TS.qs.length,ok=TS.ok;
 const msg=ok===n?'Отлично! Все предложения правильно.':ok>=7?'Хороший результат!':ok>=4?'Неплохо для начала. Повторите слова и попробуйте ещё раз.':'Сначала потренируйте слова в режимах «Слова» и «Карточки», потом возвращайтесь.';
 stage.innerHTML=`<div class="tmeta"><span>Тест закончен</span></div>
  <div class="progress"><i style="width:100%"></i></div>
  <div class="score">${ok} из ${n}</div><p class="tr">${msg}</p>
  ${TS.wrong.length?`<h3>Ошибки — прочитайте эти предложения вслух:</h3><ul class="res">${TS.wrong.map(q=>`<li>
   <div class="jp">${fillS(q,`<span class="fill">${q.a}</span>`)}</div>
   <div>${q.rd}</div><div class="ro">${q.ru} Вы выбрали: <span class="jp">${q.picked}</span></div></li>`).join('')}</ul>`:''}
  <div class="act"><button class="btn primary" id="tAgain">Новый тест</button><button class="btn" id="tBack">К тренировке</button></div>`;
 $('tAgain').onclick=startTest;
 $('tBack').onclick=()=>{TS=null;render()}}

function render(){
 clearTimeout(timer);const m=S.settings.mode;
 document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',!TS&&b.dataset.mode===m));
 if(TS){renderTest();renderStatus();return}
 $('navChoice').textContent=isKanji()?'Знак → смысл':'Знак → звук';
 $('navRev').textContent=isKanji()?'Смысл → знак':'Звук → знак';
 if(m==='choice')renderChoice(false);else if(m==='rev')renderChoice(true);
 else if(m==='card')renderCard();else if(m==='word')renderWord();else if(m==='listen')renderListen();else renderTable();
 renderStatus()}
const next=render;

// ---- Озвучка: встроенный синтезатор речи устройства ----
let jaVoice=null;
function loadVoices(){try{const v=speechSynthesis.getVoices();jaVoice=v.find(x=>/^ja/i.test(x.lang))||null}catch(e){}}
if('speechSynthesis' in window){loadVoices();speechSynthesis.onvoiceschanged=loadVoices}
function say(text,rate){
 if(!('speechSynthesis' in window))return;
 try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='ja-JP';if(jaVoice)u.voice=jaVoice;u.rate=rate||.85;speechSynthesis.speak(u)}catch(e){}}
function voiceWarn(){
 if(!('speechSynthesis' in window))return '<div class="warn">Этот браузер не умеет произносить текст. Откройте тренажёр в Chrome или Safari.</div>';
 const v=speechSynthesis.getVoices();
 if(v.length&&!v.some(x=>/^ja/i.test(x.lang)))return `<div class="warn">На устройстве не найден японский голос, поэтому звука может не быть.<br>
  Windows: Параметры → Время и язык → Речь → Добавить голоса → японский.<br>
  iPhone: Настройки → Универсальный доступ → Устный контент → Голоса → японский.<br>
  Android: Настройки → Синтез речи → установить японский язык.</div>`;
 return ''}

// ---- Режим «На слух»: звучит слог, слово или чтение иероглифа, нужно выбрать написание ----
let LQ=null;
function listenWords(){if(isKanji())return [];let wp=wordPool();
 if(hardMode())wp=wp.filter(w=>[...w[0]].some(c=>isHard(c)||isHard(toKata(c))));return wp}
function renderListen(){
 const p=pool(),tp=targets(p);answered=false;
 if(!tp.length){LQ=null;answered=true;renderNoHard();return}
 const wp=listenWords();let q;
 if(wp.length>=4&&Math.random()<.35){
  let w;do{w=wp[Math.floor(Math.random()*wp.length)]}while(wp.length>1&&w[0]===lastWord);lastWord=w[0];
  const sc=S.settings.script,kata=sc==='kata'||(sc==='both'&&Math.random()<.5),cv=s=>kata?toKata(s):s;
  const others=[];for(const x of shuffle(wp.slice())){if(others.length>=3)break;if(x[0]!==w[0]&&!others.some(o=>o[0]===x[0]))others.push(x)}
  const all=shuffle([w,...others]);
  q={kind:'word',say:w[0],ans:cv(w[0]),opts:all.map(x=>cv(x[0])),optSay:all.map(x=>x[0]),info:`${w[1]} — ${w[2]}`}
 }else{
  cur=pick(tp);const all=shuffle([cur,...distractors(cur,p)]);
  q=cur.kanji
   ?{kind:'kanji',ch:cur.ch,say:cur.ex.k,ans:cur.ex.w,opts:all.map(x=>x.ex.w),optSay:all.map(x=>x.ex.k),info:`<span class="jp">${cur.ex.k}</span> · ${cur.ex.r} — ${cur.ex.m}`}
   :{kind:'syl',ch:cur.ch,say:cur.ch,ans:cur.ch,opts:all.map(x=>x.ch),optSay:all.map(x=>x.ch),info:`${cur.ru} (${cur.ro})`}
 }
 LQ=q;
 stage.innerHTML=`<div class="prompt"><button class="listen" id="lsPlay" type="button" aria-label="Послушать ещё раз">🔊</button>
  <button class="link" id="lsSlow" type="button">послушать медленнее</button></div>
  <div class="opts">${q.opts.map((o,i)=>`<button class="opt jp ${q.kind==='syl'?'':'w'}" data-i="${i}"><span class="k">${i+1}</span>${o}</button>`).join('')}</div>
  <div class="fb" id="fb"><span class="ro">Послушайте и выберите, как это пишется. Пробел — послушать ещё раз.</span>${voiceWarn()}</div>`;
 $('lsPlay').onclick=()=>say(q.say);$('lsSlow').onclick=()=>say(q.say,.5);
 stage.querySelectorAll('.opt').forEach(b=>b.onclick=()=>listenChoose(+b.dataset.i));
 say(q.say)}
function listenChoose(i){
 const q=LQ;if(answered||!q||q.opts[i]===undefined)return;answered=true;
 const ok=q.opts[i]===q.ans;
 if(q.kind==='word'){if(ok)sess.r++;else{sess.w++;[...q.ans].forEach(c=>{const s=st(c);s.wt=Math.min(12,s.wt+2)})}save();renderStatus()}
 else grade(q.ch,ok);
 stage.querySelectorAll('.opt').forEach((b,j)=>{if(q.opts[j]===q.ans)b.classList.add('right');else if(j===i)b.classList.add('wrong');b.disabled=true});
 $('fb').innerHTML=`${ok?'Верно!':'Не совсем.'} <span class="jp">${q.ans}</span> — ${q.info}
  ${ok?'':`<br>Вы выбрали <span class="jp">${q.opts[i]}</span> <button class="link" type="button" id="lsMine">🔊 как звучит ваш вариант</button>`}
  <br><br><button class="btn" type="button" id="lsAgain">🔊 Ещё раз</button> <button class="btn primary" type="button" id="nx">Дальше<span class="k">Enter</span></button>`;
 $('lsAgain').onclick=()=>say(q.say);$('nx').onclick=next;
 if(!ok)$('lsMine').onclick=()=>say(q.optSay[i])}

// settings UI
const gbox=$('groups');
const gKey=()=>isKanji()?'kgroups':'groups';
function buildGroupsUI(){
 gbox.innerHTML=isKanji()
  ?'<b>Темы</b>'+KGROUPS.map(g=>`<label><input type="checkbox" value="${g.id}"> ${g.label} <span class="jp" style="font-size:18px">${g.items.slice(0,3).map(t=>t[0]).join('')}…</span></label>`).join('')
  :'<b>Ряды</b>'+GROUPS.map(g=>`<label><input type="checkbox" value="${g.id}"> <span class="jp" style="font-size:20px">${g.label}</span> ${g.suffix||'ряд'}</label>`).join('')+
   '<span class="rowtools"><button class="link" type="button" id="allRows">включить все</button> · <button class="link" type="button" id="startRows">только начальные</button></span>';
 const setRows=ids=>{S.settings.groups=ids;save();syncSettingsUI();render()};
 if($('allRows')){$('allRows').onclick=()=>setRows(GROUPS.map(g=>g.id));$('startRows').onclick=()=>setRows(START_GROUPS.slice())}}
function syncSettingsUI(){
 buildGroupsUI();
 gbox.querySelectorAll('input').forEach(i=>i.checked=S.settings[gKey()].includes(i.value));
 document.querySelectorAll('input[name=sc]').forEach(i=>i.checked=i.value===S.settings.script)}
$('trainHard').onclick=()=>{S.settings.hardOnly=!hardMode();
 if(hardMode()&&S.settings.mode==='table')S.settings.mode='choice';
 save();render();window.scrollTo({top:0,behavior:'smooth'})};
gbox.addEventListener('change',()=>{
 const sel=[...gbox.querySelectorAll('input:checked')].map(i=>i.value);
 if(!sel.length){syncSettingsUI();return}
 S.settings[gKey()]=sel;save();render()});
document.querySelectorAll('input[name=sc]').forEach(i=>i.addEventListener('change',()=>{S.settings.script=i.value;last=null;lastWord=null;save();syncSettingsUI();render()}));
$('startTest').onclick=startTest;
$('nav').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;TS=null;S.settings.mode=b.dataset.mode;save();render()});
let resetArmed=null;
$('reset').onclick=()=>{const b=$('reset');
 if(!resetArmed){b.textContent='Точно стереть статистику? Нажмите ещё раз';resetArmed=setTimeout(()=>{resetArmed=null;b.textContent='Сбросить статистику'},4000);return}
 clearTimeout(resetArmed);resetArmed=null;b.textContent='Сбросить статистику';S.stats={};save();sess.r=sess.w=0;render()};
document.addEventListener('keydown',e=>{
 if(e.target.tagName==='INPUT'||e.target.tagName==='SUMMARY')return;
 if(TS){
  if(TS.i>=TS.qs.length)return;
  if(/^[1-4]$/.test(e.key)&&!TS.answered){e.preventDefault();testChoose(+e.key-1)}
  else if((e.key==='Enter'||e.key===' ')&&TS.answered){e.preventDefault();testNext()}
  return}
 const m=S.settings.mode;
 if(m==='choice'||m==='rev'||m==='listen'){
  if(/^[1-4]$/.test(e.key)&&!answered){e.preventDefault();(m==='listen'?listenChoose:choose)(+e.key-1)}
  else if((e.key==='Enter'||e.key===' ')&&answered){e.preventDefault();next()}
  else if(m==='listen'&&e.key===' '&&!answered&&LQ){e.preventDefault();say(LQ.say)}}
 else if(m==='card'||m==='word'){
  if((e.key===' '||e.key==='Enter')&&!answered){e.preventDefault();reveal()}
  else if(answered&&(e.key==='1'||e.key==='2')){e.preventDefault();gradeCurrent(e.key==='2')}}});
// ---- Таймер занятий: считает время за сегодня, цель 10 минут ----
const GOAL=600,IDLE=90000;
const todayStr=()=>{const d=new Date();return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate()};
function timeObj(){const t=todayStr();if(!S.time||S.time.date!==t)S.time={date:t,sec:0};return S.time}
let lastAct=Date.now();
['pointerdown','keydown','touchstart'].forEach(ev=>document.addEventListener(ev,()=>{lastAct=Date.now();drawTimer()},{passive:true}));
const fmt=s=>String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
function isActive(){return document.visibilityState==='visible'&&Date.now()-lastAct<IDLE}
function drawTimer(){
 const t=timeObj(),done=t.sec>=GOAL,act=isActive();
 $('tmText').textContent=fmt(t.sec);
 $('tmState').textContent=act?'':'пауза';
 $('tmBar').style.width=Math.min(100,t.sec/GOAL*100)+'%';
 $('timer').classList.toggle('done',done);$('timer').classList.toggle('paused',!act);
 $('tmCheck').hidden=!done}
let tick=0;
setInterval(()=>{if(isActive()){const t=timeObj();t.sec++;if(++tick%5===0)save();
  if(t.sec===GOAL){save();drawTimer();const c=$('tmCheck');c.classList.remove('pop');void c.offsetWidth;c.classList.add('pop')}}
 drawTimer()},1000);
delete S.done;
document.addEventListener('visibilitychange',()=>{save();drawTimer()});
drawTimer();

syncSettingsUI();render();
</script>
</body>
</html>
